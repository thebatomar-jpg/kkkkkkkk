<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C0A1D">
<title>كل سنة وإنتي طيبة يا ماما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C0A1D;
  --pome:#C2294A;
  --rose:#F4A6B7;
  --gold:#F1D9A7;
  --paper:#FAEDE8;
  --paper-ink:#4B1A2F;
  --display:"Aref Ruqaa","Amiri",Georgia,serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:#FFF1F4;font-family:var(--body);
  min-height:100vh;min-height:100svh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden;height:100vh;height:100svh}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 85% -10%,#4A1238 0%,transparent 60%),
    radial-gradient(55vmax 55vmax at 0% 105%,#33102E 0%,transparent 60%);
}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.ico{width:1em;height:.92em;fill:currentColor;display:inline-block}
.pulse{animation:beat 1.25s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.2)}28%{transform:scale(1)}40%{transform:scale(1.12)}}

/* ============ الباسورد ============ */
#gate{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:24px;text-align:center;
  transition:opacity .9s ease,transform 1.2s ease,filter 1.2s ease;
}
#gate[hidden]{display:none}
#gate.out{opacity:0;transform:scale(1.08);filter:blur(12px);pointer-events:none}
.seal-wrap{filter:drop-shadow(0 14px 34px rgba(194,41,74,.5));animation:beat 1.8s ease-in-out infinite}
.seal-wrap.stop{animation:none}
.seal{position:relative;width:132px;height:132px}
.seal.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.seal-half{
  position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#E9506F,#B01E40 55%,#7A1030);
  transition:transform .95s cubic-bezier(.5,0,.2,1),opacity .95s ease;
}
.seal-half::before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
.seal-half.l{clip-path:polygon(0 0,54% 0,46% 22%,57% 44%,45% 66%,55% 100%,0 100%)}
.seal-half.r{clip-path:polygon(54% 0,100% 0,100% 100%,55% 100%,45% 66%,57% 44%,46% 22%)}
.seal-half svg{width:54px;height:50px;fill:#FFD6DE;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 -1px 0 rgba(0,0,0,.3))}
.seal.broken .l{transform:translate(-70px,36px) rotate(-26deg);opacity:0}
.seal.broken .r{transform:translate(70px,46px) rotate(28deg);opacity:0}
#gateTitle{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);color:var(--gold);line-height:1.3}
#gateSub{font-size:17px;opacity:.85}
#gateForm{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#pw{
  width:min(260px,76vw);padding:14px 20px;font:inherit;font-size:18px;text-align:center;color:#fff;
  border-radius:999px;border:1px solid rgba(241,217,167,.35);background:rgba(255,255,255,.07);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
#pw:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(241,217,167,.16)}
.btn{
  padding:14px 30px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);
  font-size:17px;font-weight:500;cursor:pointer;transition:transform .15s,box-shadow .2s;
  box-shadow:0 10px 26px rgba(241,217,167,.18);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
#err{min-height:24px;color:#FF9DB0;font-size:15px}
#hint{font-size:14px;opacity:.6}

/* ============ الموقع ============ */
#site{position:relative;z-index:1;visibility:hidden}
#site.on{visibility:visible}
.sec{
  position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(18px,3svh,30px);padding:clamp(80px,14svh,140px) 22px;
}
h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,7.5vw,52px);line-height:1.3;color:var(--gold)}
.lead{font-size:clamp(16px,3.8vw,19px);line-height:1.9;max-width:34ch;opacity:.88}

/* البداية */
.hero{
  min-height:100vh;min-height:100svh;justify-content:center;
  gap:clamp(6px,1.6svh,16px);padding-top:max(24px,env(safe-area-inset-top));padding-bottom:28px;
}
#heartCanvas{width:min(560px,94vw);height:min(46vh,420px);touch-action:pan-y;cursor:pointer}
#heroTitle{
  font-family:var(--display);font-weight:700;font-size:clamp(36px,10.5vw,78px);line-height:1.25;
  color:var(--gold);text-shadow:0 0 36px rgba(194,41,74,.5);
}
.w{
  display:inline-block;opacity:0;filter:blur(10px);transform:translateY(16px) scale(.96);
  transition:opacity 1s ease,filter 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i) * .24s + .5s);
}
.go .w{opacity:1;filter:none;transform:none}
.hero .sub{font-size:clamp(16px,4vw,20px);line-height:1.9;max-width:30ch;opacity:0;transition:opacity 1.2s ease 1.9s}
.go .sub{opacity:.88}
.cue{width:1px;height:48px;background:rgba(255,255,255,.2);position:relative;overflow:hidden;opacity:0;transition:opacity 1s ease 2.6s;margin-top:8px}
.go .cue{opacity:1}
.cue i{position:absolute;inset-inline:0;top:-40%;height:40%;background:var(--gold);animation:drop 1.8s ease-in-out infinite}
@keyframes drop{to{top:110%}}

/* العدّاد */
.since{display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,5vw,50px);margin-top:6px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;min-width:80px}
.unit+.unit::before{
  content:"";position:absolute;top:14%;height:56%;width:1px;
  inset-inline-start:calc(clamp(9px,2.5vw,25px) * -1);background:rgba(241,217,167,.24);
}
.unit b{
  font-family:var(--display);font-weight:700;font-size:clamp(66px,20vw,136px);line-height:1;color:var(--gold);
  text-shadow:0 0 44px rgba(241,217,167,.22);
}
.unit span{font-size:18px;color:var(--rose);margin-top:6px}
.live{display:flex;align-items:center;gap:10px;font-size:clamp(16px,4vw,20px);font-variant-numeric:tabular-nums;color:#FFE5EB}
.live .ico{color:var(--pome);font-size:24px}

/* الصور */
.deck{position:relative;width:min(320px,78vw);aspect-ratio:4/5;margin:14px 0 6px;touch-action:pan-y;outline-offset:14px}
.polaroid{
  position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 12px 0;background:var(--paper);
  border-radius:6px;box-shadow:0 22px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s ease;will-change:transform;
  user-select:none;-webkit-user-select:none;cursor:grab;
}
.polaroid.top:active{cursor:grabbing}
.ph{position:relative;flex:1;border-radius:3px;overflow:hidden;background:linear-gradient(140deg,#5A1A40,#C2294A 60%,#F4A6B7);display:grid;place-items:center}
.ph svg{width:44px;height:41px;fill:rgba(255,255,255,.55)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.polaroid figcaption{font-family:var(--display);color:var(--paper-ink);font-size:21px;padding:11px 4px 13px;min-height:58px;display:grid;place-items:center}
.tip{font-size:15px;opacity:.65}

/* الأغنية */
.player{
  width:min(340px,86vw);aspect-ratio:1;padding:14px;border-radius:26px;display:grid;grid-template-rows:1fr auto auto;gap:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 60px rgba(0,0,0,.45);text-align:start;
}
.cover{position:relative;border-radius:16px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 18%,#F7B7C5,#C2294A 55%,#52103C)}
.cover > .big{width:34%;fill:rgba(255,255,255,.92);filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.player.playing .cover > .big{animation:beat 1.25s ease-in-out infinite}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eq{position:absolute;inset-inline:0;bottom:0;height:44%;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:0 18px 12px}
.eq i{width:7px;height:18%;border-radius:4px;background:rgba(255,255,255,.88);transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.player.playing .eq i{animation-play-state:running}
.eq i:nth-child(1){animation-duration:.9s}.eq i:nth-child(2){animation-duration:1.2s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:.8s;animation-delay:-.5s}.eq i:nth-child(4){animation-duration:1.1s;animation-delay:-.2s}
.eq i:nth-child(5){animation-duration:.95s;animation-delay:-.7s}.eq i:nth-child(6){animation-duration:1.25s;animation-delay:-.1s}
.eq i:nth-child(7){animation-duration:.85s;animation-delay:-.4s}.eq i:nth-child(8){animation-duration:1.05s;animation-delay:-.6s}
.eq i:nth-child(9){animation-duration:.9s;animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(3.2)}}
.meta{display:flex;align-items:center;gap:12px}
.meta .t{flex:1;min-width:0}
.meta .name{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .artist{font-size:13px;opacity:.7;margin-top:2px}
.play{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.play:hover{transform:scale(1.06)}.play:active{transform:scale(.95)}
.play svg{width:22px;height:22px;fill:currentColor}
.play .i-pause{display:none}.player.playing .i-pause{display:block}.player.playing .i-play{display:none}
.play.nudge{animation:beat 1.4s ease-in-out 2}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;touch-action:none;margin:8px 0 4px}
.bar::after{content:"";position:absolute;inset:-12px 0}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--rose))}
.times{display:flex;justify-content:space-between;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:#FFB8C6}

/* الرسالة */
.letter{
  width:min(560px,92vw);background:var(--paper);color:var(--paper-ink);border-radius:6px;text-align:start;
  padding:clamp(28px,6vw,50px) clamp(24px,6vw,46px);box-shadow:0 30px 70px rgba(0,0,0,.5);
  transform:rotate(-.5deg);outline:1px solid rgba(75,26,47,.14);outline-offset:-10px;
}
.letter .hi{font-family:var(--display);font-weight:700;font-size:clamp(27px,6vw,34px);color:var(--pome);margin-bottom:14px}
.letter p.para{font-family:var(--display);font-size:clamp(20px,4.7vw,25px);line-height:2.1;margin-bottom:10px}
.letter .sign{font-family:var(--display);font-weight:700;font-size:clamp(24px,5.5vw,30px);color:var(--pome);margin-top:18px;white-space:pre-line;line-height:1.7}
.lw{opacity:0;transition:opacity .7s ease;transition-delay:calc(var(--i) * .085s)}
.read .lw{opacity:1}

/* الشمعة */
.cake{width:min(270px,72vw);height:auto;overflow:visible;-webkit-tap-highlight-color:transparent}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:transform .35s ease,opacity .3s ease}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.07) rotate(2deg)}}
.glow{animation:glow 1.6s ease-in-out infinite;transition:opacity .4s}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.7}}
.blown .flame{transform:scale(0);opacity:0;animation:none}
.blown .glow{opacity:0;animation:none}
.smoke{opacity:0;fill:rgba(255,255,255,.7);transform-box:fill-box;transform-origin:center}
.blown .smoke{animation:rise 1.7s ease-out forwards}
.blown .smoke:nth-of-type(2){animation-delay:.2s}.blown .smoke:nth-of-type(3){animation-delay:.4s}
@keyframes rise{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-46px) scale(2)}}
#wishTxt{font-family:var(--display);font-size:clamp(24px,6vw,32px);line-height:1.6;color:var(--gold);max-width:20ch;min-height:3.2em;display:grid;place-items:center}
.end{height:80px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></symbol>
</svg>

<canvas id="ambient" aria-hidden="true"></canvas>

<!-- ======== الباسورد ======== -->
<div id="gate">
  <div class="seal-wrap" id="sealWrap">
    <div class="seal" id="seal">
      <div class="seal-half l"><svg viewBox="0 0 32 29.6"><use href="#heart"/></svg></div>
      <div class="seal-half r"><svg viewBox="0 0 32 29.6"><use href="#heart"/></svg></div>
    </div>
  </div>
  <h2 id="gateTitle" style="font-size:clamp(30px,8vw,44px)"></h2>
  <p id="gateSub">اكتبي الباسورد وافتحي المفاجأة</p>
  <form id="gateForm" autocomplete="off">
    <input id="pw" type="password" placeholder="الباسورد" aria-label="الباسورد" required>
    <button class="btn" type="submit">افتحي</button>
  </form>
  <p id="err" role="alert"></p>
  <p id="hint"></p>
</div>

<!-- ======== الموقع ======== -->
<main id="site">

  <section class="sec hero" id="hero">
    <canvas id="heartCanvas" aria-label="قلب بيدق"></canvas>
    <h1 id="heroTitle"></h1>
    <p class="sub" id="heroSub"></p>
    <div class="cue" aria-hidden="true"><i></i></div>
  </section>

  <section class="sec" id="since">
    <h2>فضلت معاكي قد إيه؟</h2>
    <p class="lead">من يوم ما اتولدت لحد اللحظة دي، وإنتي جنبي.</p>
    <div class="since">
      <div class="unit"><b id="uy">٠</b><span>سنة</span></div>
      <div class="unit"><b id="um">٠</b><span>شهر</span></div>
      <div class="unit"><b id="ud">٠</b><span>يوم</span></div>
    </div>
    <p class="live"><svg class="ico pulse" viewBox="0 0 32 29.6"><use href="#heart"/></svg><span id="live"></span></p>
  </section>

  <section class="sec" id="photos">
    <h2>صور مابينا</h2>
    <div class="deck" id="deck" tabindex="0" role="group" aria-label="صور، اضغطي أو اسحبي للصورة اللي بعدها"></div>
    <p class="tip">اسحبي الصورة أو دوسي عليها</p>
  </section>

  <section class="sec" id="song">
    <h2>أغنية ليكي</h2>
    <div class="player" id="player">
      <div class="cover" id="cover">
        <svg class="big" viewBox="0 0 32 29.6"><use href="#heart"/></svg>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="meta">
        <div class="t"><div class="name" id="songName"></div><div class="artist" id="songArtist"></div></div>
        <button class="play" id="playBtn" aria-label="شغّلي الأغنية">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.5"/><rect x="14" y="4" width="4.5" height="16" rx="1.5"/></svg>
        </button>
      </div>
      <div>
        <div class="bar" id="bar" role="slider" aria-label="موضع الأغنية"><i id="prog"></i></div>
        <div class="times"><span id="cur">٠:٠٠</span><span id="dur">٠:٠٠</span></div>
      </div>
    </div>
    <p class="note" id="audioNote" hidden></p>
  </section>

  <section class="sec" id="letter">
    <h2>رسالة صغيرة</h2>
    <article class="letter" id="letterCard">
      <p class="hi" id="lHi"></p>
      <div id="lBody"></div>
      <p class="sign" id="lSign"></p>
    </article>
  </section>

  <section class="sec" id="wish">
    <p id="wishTxt"></p>
    <svg class="cake" id="cake" viewBox="0 0 240 240" role="img" aria-label="تورتة عليها شمعة">
      <defs>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
        <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset=".6" stop-color="#FFC857"/><stop offset="1" stop-color="#FFF3B0"/></linearGradient>
      </defs>
      <ellipse cx="120" cy="214" rx="104" ry="14" fill="#F1D9A7" opacity=".9"/>
      <rect x="38" y="140" width="164" height="70" rx="14" fill="#C2294A"/>
      <path d="M38 152 Q48 170 58 152 T78 152 T98 152 T118 152 T138 152 T158 152 T178 152 T198 152 L202 140 L38 140Z" fill="#FAEDE8"/>
      <rect x="68" y="94" width="104" height="50" rx="12" fill="#F4A6B7"/>
      <path d="M68 108 Q78 124 88 108 T108 108 T128 108 T148 108 T168 108 L172 94 L68 94Z" fill="#FAEDE8"/>
      <use href="#heart" x="62" y="176" width="16" height="15" fill="#F1D9A7"/>
      <use href="#heart" x="112" y="182" width="16" height="15" fill="#F1D9A7"/>
      <use href="#heart" x="162" y="176" width="16" height="15" fill="#F1D9A7"/>
      <rect x="115" y="58" width="10" height="38" rx="3" fill="#F1D9A7"/>
      <path d="M115 68l10-6M115 80l10-6M115 92l10-6" stroke="#C2294A" stroke-width="2.4" opacity=".7"/>
      <circle class="glow" cx="120" cy="42" r="40" fill="url(#gGlow)"/>
      <path class="flame" d="M120 24C131 36 133 47 120 56C107 47 109 36 120 24Z" fill="url(#gFlame)"/>
      <circle class="smoke" cx="120" cy="50" r="5"/>
      <circle class="smoke" cx="117" cy="50" r="4"/>
      <circle class="smoke" cx="123" cy="50" r="4"/>
      <circle id="flameHit" cx="120" cy="44" r="36" fill="transparent" style="cursor:pointer"/>
    </svg>
    <button class="btn" id="cakeBtn" type="button">طفي الشمعة</button>
    <div class="end"></div>
  </section>

</main>

<script>
/* ===================== عدّلي هنا بس ===================== */
const CONFIG = {
  password: "امي",                       // الباسورد
  hint: "حاجه بنقلها كل يوم ",                               // تلميح اختياري يظهر تحت الباسورد
  momName: "شوشو",
  birthDate: "1990-11-07T00:00:00",       // تاريخ ميلادك إنت (للعدّاد)
  photos: [                               // الصور في فولدر images
    { src: "images/1.jpg", caption: "أحلى يوم" },
    { src: "images/2.jpg", caption: "ضحكتك" },
    { src: "images/3.jpg", caption: "حضنك" },
    { src: "images/4.jpg", caption: "ذكرى حلوة" },
    { src: "images/5.jpg", caption: "معاكي دايمًا" },
    //{ src: "images/6.jpg", caption: "بحبك" }
  ],
  song: { file: "song.mp3", title: "و انت عمري", artist: "ام كلثوم", cover: "" },
  letterHi: "إلى أحلى حاجة في حياتي،",
  letter: [
    "مهما كتبت، مش هعرف أشكرك على كل اللي عملتيه معايا. كنتي دايمًا أول واحدة تفرح لي، وأول واحدة تسندني لما الدنيا تتعب.",
    "دعواتك هي اللي مكمّلاني، وحضنك هو أأمن مكان عرفته في حياتي.",
    "كل سنة وإنتي طيبة يا ماما. ربنا يخليكي ليا ويديكي الصحة والسعادة اللي تستاهليها وأكتر."
  ],
  letterSign: "بحبك،\n mora",
  wishBefore: "اتمني أمنية في سرك، وبعدين طفي الشمعة",
  wishAfter: "إن شاء الله أمنيتك تتحقق، وكل سنة وإنتي أحلى ام"
};
/* ======================================================== */

(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const C = CONFIG;
  const HEART = new Path2D('M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z');
  let playing = false;

  document.title = 'كل سنة وإنتي طيبة يا ' + C.momName;
  $('#gateTitle').textContent = 'مفاجأة ليكي يا ' + C.momName;
  $('#hint').textContent = C.hint;

  function words(el, text, cls, start = 0) {
    const parts = text.split(/ +/).filter(Boolean);
    parts.forEach((w, i) => {
      const s = document.createElement('span');
      s.className = cls; s.style.setProperty('--i', start + i); s.textContent = w;
      el.appendChild(s);
      if (i < parts.length - 1) el.appendChild(document.createTextNode(' '));
    });
    return start + parts.length;
  }

  /* ---------- القلوب في الخلفية + الانفجارات ---------- */
  const amb = $('#ambient'), actx = amb.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const hearts = [], COLORS = ['#F4A6B7', '#C2294A', '#F1D9A7', '#FF7A95'];
  let spawnAcc = 0, tAmb = 0, ambN = 0;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    amb.width = W * DPR; amb.height = H * DPR; amb.style.width = W + 'px'; amb.style.height = H + 'px';
    sizeHero();
  }
  function spawnAmb(anywhere) {
    const bx = Math.random() * W;
    hearts.push({
      type: 'amb', bx, x: bx, y: anywhere ? Math.random() * H : H + 30,
      s: 8 + Math.random() * 16, vy: -(18 + Math.random() * 34), a: .1 + Math.random() * .26,
      ph: Math.random() * 6.28, amp: 10 + Math.random() * 22, r: 0,
      col: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }
  function burst(x, y, n = 12, power = 1) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * 6.283, sp = (120 + Math.random() * 320) * power;
      hearts.push({
        type: 'b', x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 170, s: 10 + Math.random() * 18,
        a: .95, r: Math.random() * 6, vr: (Math.random() - .5) * 6,
        life: 1.4 + Math.random() * 1.2, col: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
    if (hearts.length > 460) hearts.splice(0, hearts.length - 460);
  }
  function updateHearts(dt) {
    tAmb += dt;
    const boost = playing ? 1.9 : 1, cap = Math.round((reduce ? 10 : 44) * boost);
    spawnAcc += dt * (reduce ? .6 : 2.6) * boost;
    while (spawnAcc >= 1) { spawnAcc -= 1; if (ambN < cap) spawnAmb(false); }
    ambN = 0;
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      if (h.type === 'amb') {
        ambN++; h.y += h.vy * dt * boost; h.x = h.bx + Math.sin(h.ph + tAmb * .7) * h.amp; h.r = Math.sin(h.ph + tAmb * .5) * .3;
        if (h.y < -40) hearts.splice(i, 1);
      } else {
        h.vy += 520 * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.vx *= Math.pow(.6, dt); h.r += h.vr * dt; h.life -= dt;
        if (h.life <= 0 || h.y > H + 60) hearts.splice(i, 1);
      }
    }
  }
  function drawHearts() {
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, amb.width, amb.height);
    for (const h of hearts) {
      let a = h.a;
      if (h.type === 'amb') a *= Math.min(1, (H - h.y) / 120) * Math.min(1, (h.y + 40) / 160);
      else a *= Math.min(1, h.life / .5);
      if (a <= .01) continue;
      const k = h.s / 32 * DPR, c = Math.cos(h.r) * k, s = Math.sin(h.r) * k;
      actx.setTransform(c, s, -s, c, h.x * DPR, h.y * DPR);
      actx.translate(-16, -15); actx.globalAlpha = a; actx.fillStyle = h.col; actx.fill(HEART);
    }
    actx.globalAlpha = 1;
  }

  /* ---------- القلب المتحرك في البداية ---------- */
  const hc = $('#heartCanvas'), hctx = hc.getContext('2d');
  let hw = 0, hh = 0, hdpr = 1, parts = [], heartVisible = false, heartStart = 0, started = false, kick = 0;
  const pointer = { x: -999, y: -999 };

  function sizeHero() {
    const r = hc.getBoundingClientRect(); hdpr = Math.min(devicePixelRatio || 1, 2);
    hw = r.width; hh = r.height; hc.width = Math.max(1, hw * hdpr); hc.height = Math.max(1, hh * hdpr);
  }
  const contour = t => [16 * Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
  function buildParts() {
    const N = innerWidth < 600 ? 700 : 1050; parts = [];
    for (let i = 0; i < N; i++) {
      const edge = Math.random() < .55, t = Math.random() * 6.283;
      const r = edge ? .965 + Math.random() * .05 : Math.sqrt(Math.random()) * .93;
      const [hx, hy] = contour(t);
      const spark = Math.random() < .07;
      const hue = spark ? 42 : 340 + Math.random() * 20, sat = spark ? 70 : 70 + Math.random() * 20;
      const lig = spark ? 78 : (edge ? 62 + Math.random() * 16 : 46 + Math.random() * 14);
      parts.push({
        ux: hx * r, uy: hy * r, x: Math.random() * hw, y: Math.random() * hh, vx: 0, vy: 0,
        s: edge ? .9 + Math.random() * 1.2 : .7 + Math.random() * 1,
        delay: Math.random() * .9, tw: Math.random() * 6.283,
        col: `hsla(${hue},${sat}%,${lig}%,.9)`
      });
    }
  }
  function drawHeart(t, dt) {
    if (!heartVisible || !started) return;
    hctx.setTransform(hdpr, 0, 0, hdpr, 0, 0); hctx.clearRect(0, 0, hw, hh);
    hctx.globalCompositeOperation = 'lighter';
    const S = Math.min(hw / 36, hh / 34), cx = hw / 2, cy = hh / 2 - 2.5 * S;
    const ph = (((t - heartStart) % 1.25) + 1.25) % 1.25 / 1.25;
    const beat = Math.exp(-Math.pow((ph - .1) / .05, 2)) + .6 * Math.exp(-Math.pow((ph - .3) / .06, 2));
    kick *= Math.pow(.05, dt);
    const sc = 1 + .045 * beat + kick * .12, el = t - heartStart, f = dt * 60, R = 72;
    for (const p of parts) {
      const tx = cx + p.ux * S * sc, ty = cy + p.uy * S * sc;
      if (reduce) { p.x = tx; p.y = ty; }
      else if (el > p.delay) {
        const K = .05 * Math.min(1, (el - p.delay) / 1.2);
        p.vx += (tx - p.x) * K * f; p.vy += (ty - p.y) * K * f;
        const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < R * R) { const d = Math.sqrt(d2) || 1, fr = (1 - d / R) * 5 * f; p.vx += dx / d * fr; p.vy += dy / d * fr; }
        const damp = Math.pow(.84, f); p.vx *= damp; p.vy *= damp; p.x += p.vx * f; p.y += p.vy * f;
      } else { p.x += Math.sin(t + p.tw) * .25; p.y += Math.cos(t * .8 + p.tw) * .25; }
      hctx.fillStyle = p.col; hctx.beginPath(); hctx.arc(p.x, p.y, p.s, 0, 6.283); hctx.fill();
    }
  }
  hc.addEventListener('pointermove', e => { const r = hc.getBoundingClientRect(); pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; });
  const leave = () => { pointer.x = pointer.y = -999; };
  hc.addEventListener('pointerleave', leave); hc.addEventListener('pointercancel', leave);
  hc.addEventListener('pointerdown', () => { kick = 1; });
  new IntersectionObserver(es => { heartVisible = es[0].isIntersecting; }, { threshold: .01 }).observe($('#hero'));

  addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    burst(e.clientX, e.clientY, 9);
  });

  /* ---------- الحلقة الرئيسية ---------- */
  addEventListener('resize', resize); resize();
  for (let i = 0; i < (reduce ? 8 : 34); i++) spawnAmb(true);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    updateHearts(dt); drawHearts(); drawHeart(now / 1000, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- فتح الباسورد ---------- */
  const gate = $('#gate'), site = $('#site'), seal = $('#seal'), err = $('#err'), pw = $('#pw');
  let opened = false;
  $('#gateForm').addEventListener('submit', e => {
    e.preventDefault(); if (opened) return;
    if (pw.value.trim().toLowerCase() === C.password.trim().toLowerCase()) openGate();
    else {
      err.textContent = 'الباسورد مش صح، جربي تاني';
      seal.classList.remove('shake'); void seal.offsetWidth; seal.classList.add('shake'); pw.select();
    }
  });
  async function openGate() {
    opened = true; err.textContent = ''; pw.blur();
    $('#sealWrap').classList.add('stop'); seal.classList.add('broken');
    const r = seal.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 70, 1.3);
    setTimeout(async () => {
      document.body.classList.remove('locked'); site.classList.add('on'); gate.classList.add('out');
      scrollTo(0, 0);
      await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]);
      sizeHero(); buildParts(); heartStart = performance.now() / 1000; started = true;
      $('#hero').classList.add('go');
      setTimeout(() => { gate.hidden = true; }, 1400);
    }, 650);
  }

  /* ---------- البداية ---------- */
  words($('#heroTitle'), 'كل سنة وإنتي طيبة يا ' + C.momName, 'w');
  $('#heroSub').textContent = 'عملتلك حاجة صغيرة في يوم ميلادك. دوسي على القلب وانزلي واحدة واحدة.';

  /* ---------- العدّاد ---------- */
  const born = new Date(C.birthDate);
  let counted = false;
  function diff(now) {
    let y = now.getFullYear() - born.getFullYear(), m = now.getMonth() - born.getMonth(), d = now.getDate() - born.getDate(),
      h = now.getHours() - born.getHours(), mi = now.getMinutes() - born.getMinutes(), s = now.getSeconds() - born.getSeconds();
    if (s < 0) { s += 60; mi--; } if (mi < 0) { mi += 60; h--; } if (h < 0) { h += 24; d--; }
    if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
    if (m < 0) { m += 12; y--; }
    return { y, m, d, h, mi, s };
  }
  function tick() {
    const v = diff(new Date());
    $('#live').textContent = `و ${toAr(v.h)} ساعة و ${toAr(v.mi)} دقيقة و ${toAr(v.s)} ثانية`;
    if (counted) { $('#uy').textContent = toAr(v.y); $('#um').textContent = toAr(v.m); $('#ud').textContent = toAr(v.d); }
  }
  tick(); setInterval(tick, 1000);
  function countUp() {
    const tg = diff(new Date()), t0 = performance.now(), D = reduce ? 1 : 1900;
    (function step(now) {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      $('#uy').textContent = toAr(Math.round(tg.y * e)); $('#um').textContent = toAr(Math.round(tg.m * e)); $('#ud').textContent = toAr(Math.round(tg.d * e));
      if (p < 1) requestAnimationFrame(step); else counted = true;
    })(t0);
  }
  const once = (el, th, fn) => {
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); fn(); } }, { threshold: th });
    io.observe(el);
  };
  once($('#since'), .4, countUp);

  /* ---------- الصور ---------- */
  const deck = $('#deck'), order = [], tilts = [-3.5, 2.5, -1.5, 4, -4.5, 1.5, -2.5, 3.2];
  let dealt = false, busy = false, drag = null;
  C.photos.forEach((p, i) => {
    const el = document.createElement('figure'); el.className = 'polaroid'; el._tilt = tilts[i % tilts.length];
    el.innerHTML = '<div class="ph"><svg viewBox="0 0 32 29.6"><use href="#heart"/></svg><img alt=""></div><figcaption></figcaption>';
    const img = $('img', el); img.src = p.src; img.onerror = () => img.remove();
    $('figcaption', el).textContent = p.caption || '';
    deck.appendChild(el); order.push(el);
  });
  function layout() {
    const n = order.length;
    order.forEach((el, i) => {
      const d = Math.min(i, 3);
      el.style.zIndex = String(n - i); el.style.opacity = i < 4 ? '1' : '0';
      el.style.transform = dealt
        ? `translate3d(${(i % 2 ? -1 : 1) * d * 4}px,${-d * 7}px,0) rotate(${el._tilt}deg) scale(${1 - d * .035})`
        : `translate3d(0,75vh,0) rotate(${el._tilt * 3}deg)`;
      el.classList.toggle('top', i === 0);
    });
  }
  order.forEach(el => { el.style.transition = 'none'; }); layout(); void deck.offsetWidth; order.forEach(el => { el.style.transition = ''; });
  once($('#photos'), .3, () => {
    dealt = true; order.forEach((el, i) => { el.style.transitionDelay = (i * .09) + 's'; }); layout();
    setTimeout(() => order.forEach(el => { el.style.transitionDelay = ''; }), 1500);
  });
  function next(dir) {
    if (busy || order.length < 2) { layout(); return; }
    busy = true; const top = order[0];
    top.style.transition = 'transform .55s cubic-bezier(.4,0,.6,1),opacity .55s ease';
    top.style.transform = `translate3d(${dir * innerWidth * .9}px,-30px,0) rotate(${dir * 22}deg)`; top.style.opacity = '0';
    setTimeout(() => {
      order.push(order.shift()); top.style.transition = 'none'; layout(); void top.offsetWidth; top.style.transition = ''; busy = false;
    }, 540);
  }
  deck.addEventListener('pointerdown', e => {
    if (busy || !dealt) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false };
    order[0].style.transition = 'none'; deck.setPointerCapture(e.pointerId);
  });
  deck.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
    if (Math.abs(drag.dx) + Math.abs(drag.dy) > 6) drag.moved = true;
    const t = order[0]; t.style.transform = `translate3d(${drag.dx}px,${drag.dy * .4}px,0) rotate(${t._tilt + drag.dx / 18}deg)`;
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const fling = !drag.moved || Math.abs(drag.dx) > 80, dir = drag.dx < 0 ? -1 : 1;
    drag = null; order[0].style.transition = '';
    if (fling) next(dir); else layout();
  };
  deck.addEventListener('pointerup', endDrag); deck.addEventListener('pointercancel', endDrag);
  deck.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); next(1); }
  });

  /* ---------- الأغنية ---------- */
  const audio = new Audio(); audio.preload = 'auto'; audio.src = C.song.file;
  const player = $('#player'), playBtn = $('#playBtn'), prog = $('#prog'), bar = $('#bar');
  $('#songName').textContent = C.song.title; $('#songArtist').textContent = C.song.artist;
  if (C.song.cover) { const im = document.createElement('img'); im.alt = ''; im.src = C.song.cover; im.onerror = () => im.remove(); $('#cover').prepend(im); }
  const fmt = s => { if (!isFinite(s)) return '٠:٠٠'; return toAr(Math.floor(s / 60)) + ':' + toAr(String(Math.floor(s % 60)).padStart(2, '0')); };
  const setPlaying = v => { playing = v; player.classList.toggle('playing', v); playBtn.setAttribute('aria-label', v ? 'وقّفي الأغنية' : 'شغّلي الأغنية'); };
  playBtn.addEventListener('click', () => {
    if (audio.paused) audio.play().catch(() => { const n = $('#audioNote'); n.hidden = false; n.textContent = 'مش قادر أشغّل الأغنية. اتأكد إن الملف ' + C.song.file + ' جنب index.html'; });
    else audio.pause();
  });
  audio.addEventListener('play', () => setPlaying(true));
  audio.addEventListener('pause', () => setPlaying(false));
  audio.addEventListener('ended', () => setPlaying(false));
  audio.addEventListener('loadedmetadata', () => { $('#dur').textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    $('#cur').textContent = fmt(audio.currentTime);
    prog.style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
  });
  audio.addEventListener('error', () => { const n = $('#audioNote'); n.hidden = false; n.textContent = 'ملف الأغنية (' + C.song.file + ') مش موجود جنب index.html'; });
  const seek = e => {
    const r = bar.getBoundingClientRect(), p = Math.min(1, Math.max(0, (r.right - e.clientX) / r.width));
    if (isFinite(audio.duration)) audio.currentTime = p * audio.duration;
  };
  let seeking = false;
  bar.addEventListener('pointerdown', e => { seeking = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => { if (seeking) seek(e); });
  bar.addEventListener('pointerup', () => { seeking = false; });
  bar.addEventListener('pointercancel', () => { seeking = false; });
  once($('#song'), .5, () => playBtn.classList.add('nudge'));

  /* ---------- الرسالة ---------- */
  let wi = words($('#lHi'), C.letterHi, 'lw');
  C.letter.forEach(t => { const p = document.createElement('p'); p.className = 'para'; wi = words(p, t, 'lw', wi); $('#lBody').appendChild(p); });
  words($('#lSign'), C.letterSign, 'lw', wi);
  once($('#letterCard'), .25, () => $('#letterCard').classList.add('read'));

  /* ---------- الشمعة ---------- */
  const cake = $('#cake'), cakeBtn = $('#cakeBtn'), wishTxt = $('#wishTxt');
  let lit = true; wishTxt.textContent = C.wishBefore;
  function toggleCandle() {
    lit = !lit; cake.classList.toggle('blown', !lit);
    if (!lit) {
      const r = $('#flameHit').getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 90, 1.5);
      setTimeout(() => burst(innerWidth * .2, innerHeight * .75, 30, 1), 250);
      setTimeout(() => burst(innerWidth * .8, innerHeight * .75, 30, 1), 450);
      wishTxt.textContent = C.wishAfter; cakeBtn.textContent = 'ولّعي الشمعة تاني';
    } else { wishTxt.textContent = C.wishBefore; cakeBtn.textContent = 'طفي الشمعة'; }
  }
  cakeBtn.addEventListener('click', toggleCandle);
  $('#flameHit').addEventListener('click', toggleCandle);
})();
</script>
